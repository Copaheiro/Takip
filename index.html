<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Yasemin & Elif" />
  <meta id="theme-color-meta" name="theme-color" content="#fff1f2" />
  <title>Yasemin & Elif — Aile Döngü Takip</title>

  <!-- Inter Font with System Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS with Class-Based Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Base typography and smooth mobile touch behavior */
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Bottom sheet entrance animation */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Striped patterns for projected period dates (Light & Dark) */
    .bg-striped-rose {
      background-image: repeating-linear-gradient(
        -45deg,
        #ffe4e6,
        #ffe4e6 4px,
        #fff1f2 4px,
        #fff1f2 8px
      );
    }
    .dark .bg-striped-rose {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(225, 29, 72, 0.26),
        rgba(225, 29, 72, 0.26) 4px,
        rgba(225, 29, 72, 0.12) 4px,
        rgba(225, 29, 72, 0.12) 8px
      );
    }
    .bg-striped-violet {
      background-image: repeating-linear-gradient(
        -45deg,
        #ede9fe,
        #ede9fe 4px,
        #f5f3ff 4px,
        #f5f3ff 8px
      );
    }
    .dark .bg-striped-violet {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(124, 58, 237, 0.28),
        rgba(124, 58, 237, 0.28) 4px,
        rgba(124, 58, 237, 0.12) 4px,
        rgba(124, 58, 237, 0.12) 8px
      );
    }

    /* Clean A4 Print Layout for Doctor Report */
    #print-report-root {
      display: none;
    }
    @media print {
      @page {
        size: A4 portrait;
        margin: 14mm;
      }
      html, body {
        background: #ffffff !important;
        color: #0f172a !important;
        height: auto !important;
        overflow: visible !important;
      }
      #app-shell, #modal-overlay, #toast, #pin-lock-screen {
        display: none !important;
      }
      #print-report-root {
        display: block !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .print-avoid-break {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

    // Pure YYYY-MM-DD local date helpers (immune to DST / UTC shifts)
    function toDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d, 12, 0, 0);
    }

    function getTodayStr() {
      return toDateStr(new Date());
    }

    function addDays(dateStr, days) {
      const dt = parseDate(dateStr);
      dt.setDate(dt.getDate() + days);
      return toDateStr(dt);
    }

    function diffDays(startStr, endStr) {
      const a = parseDate(startStr);
      const b = parseDate(endStr);
      return Math.round((b - a) / (1000 * 60 * 60 * 24));
    }

    function formatDateShort(dateStr) {
      if (!dateStr) return '-';
      const [y, m, d] = dateStr.split('-').map(Number);
      return `${d} ${TR_MONTHS_SHORT[m - 1]} ${y}`;
    }

    function formatDateDayMonth(dateStr) {
      if (!dateStr) return '-';
      const [, m, d] = dateStr.split('-').map(Number);
      return `${d} ${TR_MONTHS_SHORT[m - 1]}`;
    }

    function formatDateFull(dateStr) {
      const dt = parseDate(dateStr);
      return `${dt.getDate()} ${TR_MONTHS[dt.getMonth()]} ${dt.getFullYear()}, ${TR_DAYS_FULL[dt.getDay()]}`;
    }

    function generateId() {
      return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    /* ============================================================================
       3. CYCLE CALCULATION ENGINE
       ============================================================================ */
    function computeProfileStats(profile) {
      const today = getTodayStr();
      const sorted = [...profile.periods].sort((a, b) => a.startDate.localeCompare(b.startDate));
      const validPeriods = sorted.filter(p => !p.ignored);
      const ignoredCount = sorted.filter(p => p.ignored).length;

      const cycleIntervals = [];
      let prevValidStart = null;
      const enrichedPeriods = sorted.map((p, idx) => {
        const duration = p.endDate
          ? Math.max(1, diffDays(p.startDate, p.endDate) + 1)
          : Math.max(1, diffDays(p.startDate, today) + 1);

        let cycleLen = null;
        if (p.ignored) {
          if (idx > 0) {
            cycleLen = Math.max(1, diffDays(sorted[idx - 1].startDate, p.startDate));
          }
        } else {
          if (prevValidStart) {
            cycleLen = Math.max(1, diffDays(prevValidStart, p.startDate));
            cycleIntervals.push(cycleLen);
          }
          prevValidStart = p.startDate;
        }
        return { ...p, duration, cycleLen };
      });

      const avgCycleLength = cycleIntervals.length > 0
        ? Math.round(cycleIntervals.reduce((s, v) => s + v, 0) / cycleIntervals.length)
        : (profile.defaultCycleLength || 28);

      const minCycleLength = cycleIntervals.length > 0 ? Math.min(...cycleIntervals) : avgCycleLength;
      const maxCycleLength = cycleIntervals.length > 0 ? Math.max(...cycleIntervals) : avgCycleLength;

      const completedValidDurations = enrichedPeriods
        .filter(p => !p.ignored && p.endDate)
        .map(p => p.duration);

      const avgPeriodLength = completedValidDurations.length > 0
        ? Math.round(completedValidDurations.reduce((s, v) => s + v, 0) / completedValidDurations.length)
        : (profile.defaultPeriodLength || 5);

      const ongoingPeriod = [...validPeriods].reverse().find(p => !p.endDate && p.startDate <= today) || null;
      const lastValidPeriod = validPeriods.length > 0 ? validPeriods[validPeriods.length - 1] : null;

      let isOnPeriod = false;
      let currentPeriodDay = 0;
      let currentCycleDay = 0;
      let nextProjectedStart = null;
      let daysUntilNext = null;
      let statusKind = 'empty'; // 'active' | 'approaching' | 'today' | 'late' | 'countdown' | 'empty'
      let statusLabel = 'Kayıt Yok';
      let statusSubLabel = 'İlk regl kaydınızı ekleyin';

      if (ongoingPeriod) {
        isOnPeriod = true;
        statusKind = 'active';
        currentPeriodDay = Math.max(1, diffDays(ongoingPeriod.startDate, today) + 1);
        currentCycleDay = currentPeriodDay;
        nextProjectedStart = addDays(ongoingPeriod.startDate, avgCycleLength);
        daysUntilNext = diffDays(today, nextProjectedStart);
        statusLabel = `Regl ${currentPeriodDay}. Gün`;
        statusSubLabel = `Başlangıç: ${formatDateShort(ongoingPeriod.startDate)}`;
      } else if (lastValidPeriod) {
        const daysSinceStart = diffDays(lastValidPeriod.startDate, today);
        if (lastValidPeriod.endDate && today >= lastValidPeriod.startDate && today <= lastValidPeriod.endDate) {
          isOnPeriod = true;
          statusKind = 'active';
          currentPeriodDay = daysSinceStart + 1;
          currentCycleDay = currentPeriodDay;
          nextProjectedStart = addDays(lastValidPeriod.startDate, avgCycleLength);
          daysUntilNext = diffDays(today, nextProjectedStart);
          statusLabel = `Regl ${currentPeriodDay}. Gün`;
          statusSubLabel = `Bitiş: ${formatDateShort(lastValidPeriod.endDate)}`;
        } else {
          currentCycleDay = Math.max(1, daysSinceStart + 1);
          nextProjectedStart = addDays(lastValidPeriod.startDate, avgCycleLength);
          daysUntilNext = diffDays(today, nextProjectedStart);
          if (daysUntilNext > 3) {
            statusKind = 'countdown';
            statusLabel = `${daysUntilNext} Gün Kaldı`;
            statusSubLabel = `Tahmini: ${formatDateShort(nextProjectedStart)}`;
          } else if (daysUntilNext >= 1 && daysUntilNext <= 3) {
            statusKind = 'approaching';
            statusLabel = `${daysUntilNext} Gün Kaldı`;
            statusSubLabel = `Tahmini: ${formatDateShort(nextProjectedStart)}`;
          } else if (daysUntilNext === 0) {
            statusKind = 'today';
            statusLabel = 'Bugün Bekleniyor';
            statusSubLabel = `Tahmini: ${formatDateShort(nextProjectedStart)}`;
          } else {
            statusKind = 'late';
            statusLabel = `${Math.abs(daysUntilNext)} Gün Gecikti`;
            statusSubLabel = `Beklenen: ${formatDateShort(nextProjectedStart)}`;
          }
        }
      }

      // Generate 6 future projected periods
      const projectedPeriods = [];
      if (nextProjectedStart) {
        let projStart = nextProjectedStart;
        for (let i = 0; i < 6; i++) {
          const projEnd = addDays(projStart, avgPeriodLength - 1);
          projectedPeriods.push({
            startDate: projStart,
            endDate: projEnd,
            cycleLen: avgCycleLength,
            duration: avgPeriodLength
          });
          projStart = addDays(projStart, avgCycleLength);
        }
      }

      // Fast calendar lookup maps
      const loggedDaysMap = {};
      sorted.forEach(p => {
        const end = p.endDate ? p.endDate : (p.startDate <= today ? today : p.startDate);
        const span = Math.min(35, Math.max(0, diffDays(p.startDate, end)));
        for (let d = 0; d <= span; d++) {
          const ds = addDays(p.startDate, d);
          loggedDaysMap[ds] = { dayNum: d + 1, periodId: p.id, ignored: p.ignored };
        }
      });

      const projectedDaysMap = {};
      projectedPeriods.forEach(pp => {
        for (let d = 0; d < pp.duration; d++) {
          const ds = addDays(pp.startDate, d);
          if (!loggedDaysMap[ds]) {
            projectedDaysMap[ds] = { dayNum: d + 1 };
          }
        }
      });

      const fertileDaysMap = {};
      if (!profile.sadeMod && nextProjectedStart) {
        const anchors = [nextProjectedStart, ...projectedPeriods.slice(1).map(p => p.startDate)];
        anchors.forEach(anchorNextStart => {
          const ovulDate = addDays(anchorNextStart, -14);
          for (let offset = -5; offset <= 1; offset++) {
            const fd = addDays(ovulDate, offset);
            if (!loggedDaysMap[fd]) {
              fertileDaysMap[fd] = (offset === 0) ? 'ovulation' : 'fertile';
            }
          }
        });
      }

      const ovulationCycleDay = Math.max(1, avgCycleLength - 14);

      return {
        enrichedPeriods,
        validPeriods,
        ignoredCount,
        avgCycleLength,
        minCycleLength,
        maxCycleLength,
        avgPeriodLength,
        ongoingPeriod,
        lastValidPeriod,
        isOnPeriod,
        currentPeriodDay,
        currentCycleDay,
        nextProjectedStart,
        daysUntilNext,
        statusKind,
        statusLabel,
        statusSubLabel,
        projectedPeriods,
        loggedDaysMap,
        projectedDaysMap,
        fertileDaysMap,
        ovulationCycleDay
      };
    }

    function renderHomeView() {

      const sampleNotice = appData.isSampleData ? `

      return `

    function renderSplitProfileCard(profile, stats, theme) {
      const totalDays = Math.max(stats.avgCycleLength, stats.currentCycleDay || 1, 28);
      const displayDays = Math.min(totalDays, 35);

      let timelineHtml = '';
      for (let d = 1; d <= displayDays; d++) {
        const isCurrent = d === stats.currentCycleDay;
        const isPeriodDay = d <= stats.avgPeriodLength;
        const isOvul = !profile.sadeMod && d === stats.ovulationCycleDay;
        const isFertile = !profile.sadeMod && (d >= stats.ovulationCycleDay - 5 && d <= stats.ovulationCycleDay + 1);

        let segClass = 'bg-slate-200/80 dark:bg-slate-700/80';
        if (isPeriodDay) {
          segClass = theme.barSolid;
        } else if (isOvul) {
          segClass = 'bg-emerald-500';
        } else if (isFertile) {
          segClass = 'bg-emerald-300/85 dark:bg-emerald-500/45';
        }

        const showLabel = d === 1 || d === 5 || d === 10 || d === 15 || d === 20 || d === 25 || d === displayDays || isCurrent;

        timelineHtml += `
          <div class="flex-1 flex flex-col items-center relative">
            <div class="w-full h-2.5 ${d === 1 ? 'rounded-l-full' : ''} ${d === displayDays ? 'rounded-r-full' : ''} ${segClass} ${isCurrent ? 'ring-2 ring-slate-900 dark:ring-white ring-offset-1 dark:ring-offset-slate-800 z-10 scale-y-125 rounded-full' : ''}"></div>
            <span class="text-[9px] mt-1 leading-none ${isCurrent ? 'font-extrabold text-slate-900 dark:text-white' : 'text-slate-400 dark:text-slate-500 font-medium'}">${showLabel ? d : ''}</span>
          </div>
        `;
      }

      const modeBadge = profile.sadeMod
        ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-white/80 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-600">Sade Mod</span>`
        : `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${theme.badgeBg}">Tam Mod</span>`;

      // Smart Preparation / Delay / Active Badge
      let smartStatusBanner = '';
      if (stats.statusKind === 'active') {
        smartStatusBanner = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${theme.badgeBg} shadow-sm">
            <span class="w-2 h-2 rounded-full ${theme.barSolid} animate-pulse"></span>
            <span>Regl Aktif • ${stats.currentPeriodDay}. Gün</span>
          </span>`;
      } else if (stats.statusKind === 'approaching') {
        smartStatusBanner = `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-900 dark:bg-amber-900/50 dark:text-amber-200 border border-amber-200/80 dark:border-amber-700/60">
            <span>🔔 Yaklaşıyor</span>
          </span>`;
      } else if (stats.statusKind === 'today') {
        smartStatusBanner = `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-900 dark:bg-amber-900/50 dark:text-amber-200 border border-amber-300 dark:border-amber-700">
            <span>📅 Bugün Bekleniyor</span>
          </span>`;
      } else if (stats.statusKind === 'late') {
        smartStatusBanner = `
          <div class="mt-2 mx-auto max-w-[260px] px-3 py-1.5 rounded-xl bg-rose-100/90 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800/70 text-[11px] font-bold text-rose-800 dark:text-rose-200">
            ⏳ Tahmini tarihten ${Math.abs(stats.daysUntilNext)} gün gecikti
          </div>`;
      }

      // Fertile / Ovulation / PMS badge for Tam Mod
      let phasePill = '';
      if (!profile.sadeMod && !stats.isOnPeriod && stats.currentCycleDay > 0) {
        const diffToOvul = stats.ovulationCycleDay - stats.currentCycleDay;
        if (diffToOvul === 0) {
          phasePill = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-200 text-[10px] font-semibold">🌸 Ovülasyon Günü</span>`;
        } else if (diffToOvul >= -1 && diffToOvul <= 5) {
          phasePill = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 text-[10px] font-semibold">🟢 Doğurganlık Dönemi</span>`;
        } else if (stats.daysUntilNext !== null && stats.daysUntilNext > 0 && stats.daysUntilNext <= 5) {
          phasePill = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-200 border border-amber-200 dark:border-amber-800/60 text-[10px] font-semibold">🌙 PMS Dönemi</span>`;
        }
      }

      const primaryBtn = stats.isOnPeriod
        ? `<button onclick="quickTogglePeriod('${profile.id}')" class="flex-1 py-2.5 px-4 rounded-2xl font-semibold text-xs ${theme.btnPrimary} shadow-md active:scale-[0.98] transition flex items-center justify-center gap-1.5">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
             <span>Regl Bitti</span>
           </button>`
        : `<button onclick="quickTogglePeriod('${profile.id}')" class="flex-1 py-2.5 px-4 rounded-2xl font-semibold text-xs ${theme.btnPrimary} shadow-md active:scale-[0.98] transition flex items-center justify-center gap-1.5">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
             <span>Regl Başladı</span>
           </button>`;

      return `
        <section class="rounded-3xl border ${theme.border} ${theme.cardBg} p-4 shadow-sm flex flex-col justify-between transition-colors">
          <!-- Card Top Row -->
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <button onclick="openProfileDetail('${profile.id}', 'analytics')" class="flex items-center gap-2.5 text-left group min-w-0">
              <div class="w-9 h-9 rounded-2xl ${theme.badgeBg} flex items-center justify-center font-bold text-sm shrink-0">
                ${escapeHtml(profile.name.charAt(0).toUpperCase())}
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <h2 class="text-base font-bold text-slate-900 dark:text-white group-hover:underline">${escapeHtml(profile.name)}</h2>
                  ${modeBadge}
                </div>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate">
                  ${stats.currentCycleDay ? `Döngünün ${stats.currentCycleDay}. günü • Ort. ${stats.avgCycleLength} gün` : `Ort. ${stats.avgCycleLength} gün döngü`}
                </p>
              </div>
            </button>

            <button onclick="openProfileDetail('${profile.id}', 'analytics')" class="px-2.5 py-1.5 rounded-xl bg-white/85 dark:bg-slate-800/90 hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200/70 dark:border-slate-700 text-[11px] font-bold flex items-center gap-1 active:scale-95 transition shrink-0">
              <span>Detay</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
            </button>
          </div>

          <!-- Center Countdown & Smart Badge -->
          <div class="text-center py-2 px-2">
            ${stats.statusKind !== 'late' && smartStatusBanner ? `<div class="mb-1.5">${smartStatusBanner}</div>` : ''}
            <div class="text-3xl font-extrabold tracking-tight ${theme.accentText} leading-tight">
              ${stats.statusLabel}
            </div>
            <div class="mt-1 flex items-center justify-center flex-wrap gap-2">
              <span class="text-xs font-medium text-slate-600 dark:text-slate-300">${stats.statusSubLabel}</span>
              ${phasePill}
            </div>
            ${stats.statusKind === 'late' ? smartStatusBanner : ''}
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-2 mt-2.5 mb-3.5">
            ${primaryBtn}
            <button onclick="openProfileDetail('${profile.id}', 'diary')" class="py-2.5 px-3.5 rounded-2xl font-semibold text-xs ${theme.btnSoft} active:scale-[0.98] transition flex items-center gap-1">
              <span>+ Günlük / İlaç</span>
            </button>
          </div>

          <!-- Horizontal Cycle Timeline Bar -->
          <div class="bg-white/80 dark:bg-slate-900/60 rounded-2xl p-2.5 border border-white dark:border-slate-700/60">
            <div class="flex items-center justify-between text-[10px] text-slate-400 dark:text-slate-400 font-medium mb-1.5 px-0.5">
              <span>Döngü Çubuğu (1–${displayDays}. Gün)</span>
              <span class="${theme.accentText} font-semibold">${stats.currentCycleDay ? stats.currentCycleDay + '. Gün' : '-'}</span>
            </div>
            <div class="flex items-start gap-[2px]">
              ${timelineHtml}
            </div>
          </div>
        </section>
      `;
    }

    function quickTogglePeriod(profileId) {
      const profile = appData.profiles[profileId];
      const stats = computeProfileStats(profile);
      const today = getTodayStr();

      if (stats.ongoingPeriod) {
        stats.ongoingPeriod.endDate = today;
        saveData();
        showToast(`${profile.name} için regl bitişi kaydedildi`);
        renderApp();
      } else if (stats.isOnPeriod && stats.lastValidPeriod) {
        openAddPeriodModal(profileId, stats.lastValidPeriod.id);
      } else {
        profile.periods.push({
          id: generateId(),
          startDate: today,
          endDate: null,
          ignored: false
        });
        saveData();
        showToast(`${profile.name} için regl başlangıcı kaydedildi`);
        renderApp();
      }
    }

    function dismissSampleNotice() {
      appData.isSampleData = false;
      saveData();
      renderApp();
    }

    /* ============================================================================
       6. VIEW 2: TAKVİM (ORTAK AİLE TAKVİMİ + KİŞİSEL GÖRÜNÜM)
       ============================================================================ */
    function renderCalendarView() {
      const p1 = appData.profiles.p1;
      const p2 = appData.profiles.p2;
      const s1 = computeProfileStats(p1);
      const s2 = computeProfileStats(p2);

      const year = uiState.calendarYear;
      const month = uiState.calendarMonth;
      const today = getTodayStr();

      const firstDayOfMonth = new Date(year, month, 1);
      const startOffset = (firstDayOfMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let cellsHtml = '';
      for (let i = 0; i < startOffset; i++) {
        cellsHtml += `<div class="h-14 rounded-xl"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = ds === today;

        if (uiState.calendarMode === 'shared') {
          const p1Log = s1.loggedDaysMap[ds];
          const p1Proj = s1.projectedDaysMap[ds];
          const p2Log = s2.loggedDaysMap[ds];
          const p2Proj = s2.projectedDaysMap[ds];
          const p1Note = hasDiaryData(p1.diary[ds]);
          const p2Note = hasDiaryData(p2.diary[ds]);

          const p1Bar = p1Log
            ? `<div class="w-full h-1.5 rounded-full ${p1Log.ignored ? 'bg-slate-300 dark:bg-slate-600' : 'bg-rose-500'}"></div>`
            : (p1Proj ? `<div class="w-full h-1.5 rounded-full border border-dashed border-rose-400 bg-rose-100/70 dark:bg-rose-900/40"></div>` : `<div class="h-1.5"></div>`);

          const p2Bar = p2Log
            ? `<div class="w-full h-1.5 rounded-full ${p2Log.ignored ? 'bg-slate-300 dark:bg-slate-600' : 'bg-violet-500'}"></div>`
            : (p2Proj ? `<div class="w-full h-1.5 rounded-full border border-dashed border-violet-400 bg-violet-100/70 dark:bg-violet-900/40"></div>` : `<div class="h-1.5"></div>`);

          cellsHtml += `
            <button onclick="openDaySheet('${ds}')" class="h-14 rounded-2xl p-1 flex flex-col items-center justify-between border transition active:scale-95 ${
              isToday
                ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-slate-900 dark:border-white shadow-sm'
                : 'bg-white dark:bg-slate-800/80 border-slate-100 dark:border-slate-700/70 hover:border-slate-300 dark:hover:border-slate-500 text-slate-800 dark:text-slate-100'
            }">
              <div class="w-full flex items-center justify-between px-0.5">
                <span class="text-xs font-bold">${day}</span>
                <span class="flex items-center gap-0.5">
                  ${p1Note ? `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>` : ''}
                  ${p2Note ? `<span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>` : ''}
                </span>
              </div>
              <div class="w-full flex flex-col gap-1 px-0.5 pb-0.5">
                ${p1Bar}
                ${p2Bar}
              </div>
            </button>
          `;
        } else {
          const activePid = uiState.calendarMode;
          const profile = appData.profiles[activePid];
          const stats = activePid === 'p1' ? s1 : s2;

          const logInfo = stats.loggedDaysMap[ds];
          const projInfo = stats.projectedDaysMap[ds];
          const fertileInfo = !profile.sadeMod ? stats.fertileDaysMap[ds] : null;
          const hasDiary = hasDiaryData(profile.diary[ds]);

          let cellBg = isToday
            ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-slate-900 dark:border-white shadow-sm'
            : 'bg-white dark:bg-slate-800/80 border-slate-100 dark:border-slate-700/70 hover:border-slate-300 text-slate-800 dark:text-slate-100';
          let topBadge = '';

          if (logInfo) {
            if (logInfo.ignored) {
              cellBg = isToday
                ? 'bg-slate-700 text-white border-slate-700'
                : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 border-slate-200 dark:border-slate-600';
            } else {
              cellBg = activePid === 'p1'
                ? (isToday ? 'bg-rose-700 text-white border-rose-700' : 'bg-rose-100/90 dark:bg-rose-900/50 text-rose-900 dark:text-rose-100 border-rose-200 dark:border-rose-800')
                : (isToday ? 'bg-violet-700 text-white border-violet-700' : 'bg-violet-100/90 dark:bg-violet-900/50 text-violet-900 dark:text-violet-100 border-violet-200 dark:border-violet-800');
            }
            topBadge = `<span class="text-[9px] font-extrabold opacity-80">${logInfo.dayNum}</span>`;
          } else if (projInfo) {
            cellBg = activePid === 'p1'
              ? 'bg-striped-rose text-rose-800 dark:text-rose-200 border-dashed border-rose-300 dark:border-rose-700'
              : 'bg-striped-violet text-violet-800 dark:text-violet-200 border-dashed border-violet-300 dark:border-violet-700';
          }

          let bottomMarker = '';
          if (fertileInfo === 'ovulation') {
            bottomMarker = `<span class="text-[11px] leading-none" title="Ovülasyon">🌸</span>`;
          } else if (fertileInfo === 'fertile') {
            bottomMarker = `<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>`;
          } else if (hasDiary) {
            bottomMarker = `<span class="w-1.5 h-1.5 rounded-full ${isToday ? 'bg-amber-400' : 'bg-amber-500'} inline-block"></span>`;
          }

          cellsHtml += `
            <button onclick="openDaySheet('${ds}')" class="h-14 rounded-2xl p-1 flex flex-col items-center justify-between border transition active:scale-95 ${cellBg}">
              <div class="w-full flex items-center justify-between px-0.5 h-3">
                ${topBadge || '<span></span>'}
                ${hasDiary && fertileInfo ? `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>` : ''}
              </div>
              <span class="text-xs font-bold leading-none">${day}</span>
              <div class="h-3 flex items-center justify-center">
                ${bottomMarker}
              </div>
            </button>
          `;
        }
      }

      let legendHtml = '';
      if (uiState.calendarMode === 'shared') {
        legendHtml = `
          <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-[11px] font-medium text-slate-600 dark:text-slate-300">
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-1.5 rounded-full bg-rose-500"></span> ${escapeHtml(p1.name)}</span>
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-1.5 rounded-full bg-violet-500"></span> ${escapeHtml(p2.name)}</span>
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-1.5 rounded-full border border-dashed border-slate-400"></span> Tahmini</span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span>/<span class="w-2 h-2 rounded-full bg-sky-400"></span> Günlük/İlaç</span>
          </div>
        `;
      } else {
        const activeProfile = appData.profiles[uiState.calendarMode];
        const barColor = uiState.calendarMode === 'p1' ? 'bg-rose-400' : 'bg-violet-400';
        const dashColor = uiState.calendarMode === 'p1' ? 'bg-striped-rose border-rose-300' : 'bg-striped-violet border-violet-300';
        legendHtml = `
          <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-[11px] font-medium text-slate-600 dark:text-slate-300">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-md ${barColor}"></span> Regl</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-md border border-dashed ${dashColor}"></span> Tahmini</span>
            ${!activeProfile.sadeMod ? `
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Doğurganlık</span>
              <span class="flex items-center gap-1">🌸 Ovülasyon</span>
            ` : `<span class="text-slate-400">(Sade Mod)</span>`}
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Günlük</span>
          </div>
        `;
      }

      return `
        <div class="p-3.5 space-y-3.5">
          <!-- Segmented Switch -->
          <div class="bg-slate-200/70 dark:bg-slate-800 p-1 rounded-2xl grid grid-cols-3 gap-1">
            <button onclick="setCalendarMode('shared')" class="py-2 rounded-xl text-xs font-bold transition ${uiState.calendarMode === 'shared' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
              Ortak Takvim
            </button>
            <button onclick="setCalendarMode('p1')" class="py-2 rounded-xl text-xs font-bold transition ${uiState.calendarMode === 'p1' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
              ${escapeHtml(p1.name)}
            </button>
            <button onclick="setCalendarMode('p2')" class="py-2 rounded-xl text-xs font-bold transition ${uiState.calendarMode === 'p2' ? 'bg-violet-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
              ${escapeHtml(p2.name)}
            </button>
          </div>

          <!-- Calendar Card -->
          <div class="bg-white dark:bg-slate-800/70 rounded-3xl border border-slate-200/80 dark:border-slate-700/80 p-3.5 shadow-sm">
            <div class="flex items-center justify-between mb-3.5 px-1">
              <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 active:scale-95 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
              </button>
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-extrabold text-slate-900 dark:text-white uppercase tracking-wide">
                  ${TR_MONTHS[month]} ${year}
                </h2>
                <button onclick="jumpCalendarToday()" class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-200 hover:bg-slate-200">Bugün</button>
              </div>
              <button onclick="changeCalendarMonth(1)" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 active:scale-95 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
              </button>
            </div>

            <div class="grid grid-cols-7 gap-1 mb-1.5 text-center">
              ${TR_DAYS_SHORT.map(d => `<div class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase">${d}</div>`).join('')}
            </div>

            <div class="grid grid-cols-7 gap-1">
              ${cellsHtml}
            </div>
          </div>

          <!-- Legend Card -->
          <div class="bg-white dark:bg-slate-800/70 rounded-2xl border border-slate-200/70 dark:border-slate-700/80 p-3">
            ${legendHtml}
            <p class="text-[10px] text-center text-slate-400 dark:text-slate-500 mt-2">Detay görmek, ilaç/belirti eklemek veya regl başlatmak için güne dokunun.</p>
          </div>
        </div>
      `;
    }

    function setCalendarMode(mode) { uiState.calendarMode = mode; renderApp(); }
    function changeCalendarMonth(delta) {
      let m = uiState.calendarMonth + delta;
      let y = uiState.calendarYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      uiState.calendarYear = y;
      uiState.calendarMonth = m;
      renderApp();
    }
    function jumpCalendarToday() {
      const now = new Date();
      uiState.calendarYear = now.getFullYear();
      uiState.calendarMonth = now.getMonth();
      renderApp();
    }

    /* ============================================================================
       7. VIEW 3: ANALİZ, GRAFİKLER, .ICS TAKVİM AKTARMA & DOKTOR RAPORU
       ============================================================================ */
    function renderAnalyticsView() {
      const pid = uiState.analyticsProfile;
      const profile = appData.profiles[pid];
      const stats = computeProfileStats(profile);
      const theme = THEMES[pid];

      const chartSvg = renderBarChartSvg(stats, theme, uiState.analyticsChartType);

      let listHtml = '';
      if (uiState.analyticsLogTab === 'past') {
        const reversed = [...stats.enrichedPeriods].reverse();
        if (reversed.length === 0) {
          listHtml = `<p class="text-center text-xs text-slate-400 py-6">Henüz geçmiş regl kaydı bulunmuyor.</p>`;
        } else {
          listHtml = reversed.map(p => {
            const cycleText = p.cycleLen ? `${p.cycleLen} Günlük Döngü` : 'İlk Kayıt';
            const endText = p.endDate ? `${p.duration} gün sürdü` : 'Devam ediyor';
            return `
              <div class="flex items-center justify-between py-3 border-b border-slate-100 dark:border-slate-700/70 last:border-0 gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-xs font-bold text-slate-900 dark:text-white">${formatDateShort(p.startDate)}</span>
                    ${p.ignored ? `<span class="px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-[10px] font-semibold">Yoksayıldı</span>` : ''}
                    ${!p.endDate ? `<span class="px-1.5 py-0.5 rounded-md ${theme.badgeBg} text-[10px] font-semibold">Aktif</span>` : ''}
                  </div>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${endText} • ${cycleText}</p>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button onclick="toggleIgnorePeriod('${pid}', '${p.id}')" class="px-2 py-1 rounded-lg text-[10px] font-semibold border transition ${
                    p.ignored
                      ? 'bg-slate-800 dark:bg-white text-white dark:text-slate-900 border-slate-800 dark:border-white'
                      : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:bg-slate-50'
                  }">

    function renderBarChartSvg(stats, theme, type) {
      const isDark = Boolean(appData.appearance.darkMode);
      const barHex = isDark ? theme.hexDark : theme.hex;
      const barSoft = isDark ? theme.hexSoftDark : theme.hexSoft;
      const gridColor = isDark ? '#334155' : '#f1f5f9';
      const labelColor = isDark ? '#94a3b8' : '#64748b';
      const valColor = isDark ? '#e2e8f0' : '#334155';

      let items = [];
      if (type === 'cycle') {
        items = stats.enrichedPeriods
          .filter(p => p.cycleLen !== null)
          .slice(-6)
          .map(p => ({ label: formatDateDayMonth(p.startDate), value: p.cycleLen, ignored: p.ignored, expected: false }));
        if (stats.nextProjectedStart) {
          items.push({ label: formatDateDayMonth(stats.nextProjectedStart), value: stats.avgCycleLength, ignored: false, expected: true });
        }
      } else {
        items = stats.enrichedPeriods
          .slice(-6)
          .map(p => ({ label: formatDateDayMonth(p.startDate), value: p.duration, ignored: p.ignored, expected: false }));
        if (stats.nextProjectedStart) {
          items.push({ label: formatDateDayMonth(stats.nextProjectedStart), value: stats.avgPeriodLength, ignored: false, expected: true });
        }
      }

      if (items.length === 0) {
        return `<div class="h-40 flex items-center justify-center text-xs text-slate-400">Grafik için yeterli kayıt bulunmuyor.</div>`;
      }

      const maxVal = Math.max(...items.map(i => i.value), type === 'cycle' ? 35 : 8);
      const yMax = Math.ceil(maxVal / 5) * 5;
      const svgW = 360, svgH = 165, padL = 28, padR = 10, padT = 22, padB = 28;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      let gridHtml = '';
      for (let s = 0; s <= 4; s++) {
        const val = Math.round((yMax / 4) * s);
        const y = padT + plotH - (plotH * (val / yMax));
        gridHtml += `
          <line x1="${padL}" y1="${y}" x2="${svgW - padR}" y2="${y}" stroke="${gridColor}" stroke-width="1" />
          <text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="#94a3b8" font-weight="600">${val}</text>
        `;
      }

      const avgVal = type === 'cycle' ? stats.avgCycleLength : stats.avgPeriodLength;
      const avgY = padT + plotH - (plotH * Math.min(avgVal, yMax) / yMax);
      const slotW = plotW / items.length;
      const barW = Math.min(28, slotW * 0.55);

      const barsHtml = items.map((item, i) => {
        const cx = padL + slotW * i + slotW / 2;
        const barH = Math.max(4, (item.value / yMax) * plotH);
        const y = padT + plotH - barH;

        let fill = barHex, stroke = 'none', dash = '';
        if (item.ignored) {
          fill = isDark ? '#475569' : '#cbd5e1';
        } else if (item.expected) {
          fill = barSoft;
          stroke = barHex;
          dash = 'stroke-dasharray="3 2" stroke-width="1.5"';
        }

        return `
          <g>
            <rect x="${cx - barW / 2}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="${fill}" stroke="${stroke}" ${dash} />
            <text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="10" font-weight="700" fill="${item.ignored ? '#94a3b8' : valColor}">${item.value}</text>
            <text x="${cx}" y="${svgH - 8}" text-anchor="middle" font-size="9" font-weight="600" fill="${item.expected ? barHex : labelColor}">${item.label}</text>
          </g>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-auto overflow-visible">
          ${gridHtml}
          <line x1="${padL}" y1="${avgY}" x2="${svgW - padR}" y2="${avgY}" stroke="${theme.hexLight}" stroke-width="1.2" stroke-dasharray="4 3" />
          ${barsHtml}
        </svg>
        <div class="flex items-center justify-center gap-4 mt-1 text-[10px] font-medium text-slate-500 dark:text-slate-400">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm" style="background:${barHex}"></span> Kayıtlı</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-slate-300 dark:bg-slate-600"></span> Yoksayılan</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm border border-dashed" style="border-color:${barHex};background:${barSoft}"></span> Tahmini</span>
        </div>
      `;
    }

    function downloadIcsFile(profileIds) {
      const nowStamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//YaseminElif//AileDonguTakip//TR',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH'
      ];

      let eventCount = 0;
      profileIds.forEach(pid => {
        const profile = appData.profiles[pid];
        const stats = computeProfileStats(profile);
        stats.projectedPeriods.forEach((pp, idx) => {
          const dtStart = pp.startDate.replace(/-/g, '');
          const dtEnd = addDays(pp.startDate, 1).replace(/-/g, '');
          const uid = `${pid}-${dtStart}-${idx}@aile-dongu-takip.local`;
          lines.push(
            'BEGIN:VEVENT',
            `UID:${uid}`,
            `DTSTAMP:${nowStamp}`,
            `DTSTART;VALUE=DATE:${dtStart}`,
            `DTEND;VALUE=DATE:${dtEnd}`,
            `SUMMARY:${profile.name} — Tahmini Regl Başlangıcı`,
            `DESCRIPTION:Ortalama ${stats.avgCycleLength} günlük döngüye göre tahmini başlangıç tarihi (Tahmini süre: ${stats.avgPeriodLength} gün).`,
            'BEGIN:VALARM',
            'TRIGGER:-P2D',
            'ACTION:DISPLAY',
            `DESCRIPTION:${profile.name} için tahmini başlangıca 2 gün kaldı.`,
            'END:VALARM',
            'END:VEVENT'
          );
          eventCount++;
        });
      });

      lines.push('END:VCALENDAR');

      if (eventCount === 0) {
        showToast('Aktarılacak tahmini tarih bulunamadı', true);
        return;
      }

      const icsContent = lines.join('\r\n');
      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const label = profileIds.length === 2 ? 'yasemin_elif' : appData.profiles[profileIds[0]].name.toLowerCase();
      a.href = url;
      a.download = `dongu_hatirlatici_${label}_${getTodayStr()}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      closeModal();
      showToast(`${eventCount} hatırlatıcı .ics olarak indirildi`);
    }

    /* ---------- Doctor Report (Preview Modal + Clean A4 Print) ---------- */
    function buildDoctorReportHtml(pid) {
      const profile = appData.profiles[pid];
      const stats = computeProfileStats(profile);
      const today = getTodayStr();
      const cutoffDate = addDays(today, -365);

      // Last 12 months periods
      const recentPeriods = [...stats.enrichedPeriods]
        .filter(p => p.startDate >= cutoffDate)
        .reverse();

      // Aggregate diary symptoms, moods, meds in last 12 months
      const symptomCounts = {};
      const moodCounts = {};
      const medCounts = {};

      Object.keys(profile.diary || {}).forEach(ds => {
        if (ds < cutoffDate) return;
        const e = profile.diary[ds];
        if (!e) return;
        (e.symptoms || []).forEach(id => {
          const lbl = SYMPTOM_OPTIONS.find(x => x.id === id)?.label || id;
          symptomCounts[lbl] = (symptomCounts[lbl] || 0) + 1;
        });
        (e.moods || []).forEach(id => {
          const lbl = MOOD_OPTIONS.find(x => x.id === id)?.label || id;
          moodCounts[lbl] = (moodCounts[lbl] || 0) + 1;
        });
        (e.meds || []).forEach(id => {
          const lbl = MED_OPTIONS.find(x => x.id === id)?.label || id;
          medCounts[lbl] = (medCounts[lbl] || 0) + 1;
        });
        (e.customMeds || []).forEach(txt => {
          const clean = String(txt).trim();
          if (clean) medCounts[clean] = (medCounts[clean] || 0) + 1;
        });
      });

      const sortCounts = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]);
      const topSymptoms = sortCounts(symptomCounts);
      const topMoods = sortCounts(moodCounts);
      const topMeds = sortCounts(medCounts);

      const periodRows = recentPeriods.length === 0
        ? `<tr><td colspan="5" class="py-3 text-center text-slate-400">Son 12 ayda kayıtlı döngü yok.</td></tr>`
        : recentPeriods.map(p => `
            <tr class="border-b border-slate-200">

              <td class="py-2 pr-2">${p.endDate ? formatDateShort(p.endDate) : 'Devam Ediyor'}</td>
              <td class="py-2 pr-2">${p.duration} gün</td>
              <td class="py-2 pr-2">${p.cycleLen ? p.cycleLen + ' gün' : '-'}</td>
              <td class="py-2">${p.ignored ? '<span class="text-slate-500">Yoksayıldı (Düzensiz)</span>' : 'Normal'}</td>
            </tr>
          `).join('');

      const badgeList = (entries, emptyText) => entries.length === 0
        ? `<p class="text-xs text-slate-400">${emptyText}</p>`
        : `<div class="flex flex-wrap gap-1.5">
            ${entries.map(([k, v]) => `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 text-xs font-medium border border-slate-200">${escapeHtml(k)} <strong>(${v}x)</strong></span>`).join('')}
          </div>`;

      return `
        <div class="text-slate-900 space-y-5 font-sans">
          <!-- Report Header -->
          <div class="border-b-2 border-slate-900 pb-3 flex items-start justify-between gap-4">
            <div>
              <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Kişisel Sağlık & Döngü Özeti</p>
              <h2 class="text-xl font-extrabold text-slate-900 mt-0.5">${escapeHtml(profile.name)} — Doktor Raporu</h2>
            </div>
            <div class="text-right text-xs text-slate-600">
              <p class="font-bold text-slate-900">Rapor Tarihi</p>
              <p>${formatDateShort(today)}</p>
            </div>
          </div>

          <!-- Summary Metrics -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 print-avoid-break">

      return `

              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
            </button>
            <div class="flex items-center gap-2">

              ${dateStr !== getTodayStr() ? `<button onclick="setDiaryDate(getTodayStr())" class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-200">Bugün</button>` : ''}
            </div>
            <button onclick="stepDiaryDate(1)" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 active:scale-95 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
            </button>
          </div>

          <!-- Diary Form Card -->
          <div class="bg-white dark:bg-slate-800/70 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-4">
            <!-- Flow -->
            <div>
              <h3 class="text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-2">Akıntı / Kanama Yoğunluğu</h3>
              <div class="grid grid-cols-4 gap-1.5">
                ${flowHtml}
              </div>
            </div>

            <!-- Medications & Pain Relief -->
            <div>

                ${medsHtml}

    function ensureDiaryEntry(pid, dateStr) {
      if (!appData.profiles[pid].diary[dateStr]) {
        appData.profiles[pid].diary[dateStr] = { flow: 'yok', meds: [], customMeds: [], symptoms: [], moods: [], note: '' };
      }
      const e = appData.profiles[pid].diary[dateStr];
      if (!Array.isArray(e.meds)) e.meds = [];
      if (!Array.isArray(e.customMeds)) e.customMeds = [];
      if (!Array.isArray(e.symptoms)) e.symptoms = [];
      if (!Array.isArray(e.moods)) e.moods = [];
      return e;
    }

    function setDiaryProfile(pid) { uiState.diaryProfile = pid; renderApp(); }
    function setDiaryDate(ds) { if (ds) { uiState.diaryDate = ds; renderApp(); } }
    function stepDiaryDate(delta) { uiState.diaryDate = addDays(uiState.diaryDate, delta); renderApp(); }

    function setDiaryFlow(flowId) {
      const e = ensureDiaryEntry(uiState.diaryProfile, uiState.diaryDate);
      e.flow = flowId;
      saveData();
      showToast('Kaydedildi');
      renderApp();
    }

    function toggleDiaryArray(field, itemId) {
      const e = ensureDiaryEntry(uiState.diaryProfile, uiState.diaryDate);
      const idx = e[field].indexOf(itemId);
      if (idx > -1) e[field].splice(idx, 1);
      else e[field].push(itemId);
      saveData();
      showToast('Kaydedildi');
      renderApp();
    }

    function addCustomMed(ev) {
      ev.preventDefault();
      const input = document.getElementById('custom-med-input');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      const e = ensureDiaryEntry(uiState.diaryProfile, uiState.diaryDate);
      e.customMeds.push(val);
      saveData();
      showToast('İlaç kaydedildi');
      renderApp();
    }

    function removeCustomMed(index) {
      const e = ensureDiaryEntry(uiState.diaryProfile, uiState.diaryDate);
      e.customMeds.splice(index, 1);
      saveData();
      showToast('İlaç kaldırıldı');
      renderApp();
    }

    function saveDiaryNote() {
      const noteEl = document.getElementById('diary-note-input');
      const e = ensureDiaryEntry(uiState.diaryProfile, uiState.diaryDate);
      e.note = noteEl ? noteEl.value.trim() : '';
      saveData();
      showToast('Not kaydedildi');
      renderApp();
    }

              <span>Verileri Sıfırla</span>
            </button>
          </div>
        </div>
      `;
    }

    function renderProfileSettingsCard(profile, theme, subtitle) {
      return `
        <div class="bg-white dark:bg-slate-800/70 rounded-3xl p-4 border ${theme.border} shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full ${theme.barSolid}"></span>
              <h3 class="text-sm font-bold text-slate-900 dark:text-white">${subtitle}</h3>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${theme.badgeBg}">${escapeHtml(profile.name)}</span>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Varsayılan Döngü (Gün)</label>
              <input type="number" min="20" max="45" value="${profile.defaultCycleLength}" onchange="updateProfileField('${profile.id}', 'defaultCycleLength', parseInt(this.value, 10) || 28)" class="w-full rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 px-3 py-2 text-xs font-bold text-slate-900 dark:text-white" />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Varsayılan Regl (Gün)</label>
              <input type="number" min="2" max="12" value="${profile.defaultPeriodLength}" onchange="updateProfileField('${profile.id}', 'defaultPeriodLength', parseInt(this.value, 10) || 5)" class="w-full rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 px-3 py-2 text-xs font-bold text-slate-900 dark:text-white" />
            </div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <div class="pr-3">
              <p class="text-xs font-bold text-slate-800 dark:text-slate-200">Sade Mod</p>
              <p class="text-[10px] text-slate-500 dark:text-slate-400">Ovülasyon ve doğurganlık göstergelerini gizler</p>
            </div>
            <button onclick="updateProfileField('${profile.id}', 'sadeMod', ${!profile.sadeMod})" class="w-12 h-7 rounded-full transition-colors p-1 shrink-0 ${profile.sadeMod ? theme.barSolid : 'bg-slate-200 dark:bg-slate-700'}">
              <div class="w-5 h-5 rounded-full bg-white shadow-sm transform transition-transform ${profile.sadeMod ? 'translate-x-5' : 'translate-x-0'}"></div>
            </button>
          </div>
        </div>
      `;
    }

    function updateProfileField(pid, field, value) {
      appData.profiles[pid][field] = value;
      saveData();
      showToast('Ayar güncellendi');
      renderApp();
    }

    /* ============================================================================
       10. MODALS & BOTTOM SHEETS
       ============================================================================ */
    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = html;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-overlay') closeModal();
    }

    function openDaySheet(dateStr) {
      const profilesToShow = uiState.calendarMode === 'shared'
        ? [appData.profiles.p1, appData.profiles.p2]
        : [appData.profiles[uiState.calendarMode]];

      const blocks = profilesToShow.map(profile => {
        const stats = computeProfileStats(profile);
        const theme = THEMES[profile.id];
        const log = stats.loggedDaysMap[dateStr];
        const proj = stats.projectedDaysMap[dateStr];
        const fertile = !profile.sadeMod ? stats.fertileDaysMap[dateStr] : null;
        const diary = profile.diary[dateStr];

        let statusText = 'Normal gün';
        if (log) statusText = `Regl ${log.dayNum}. gün ${log.ignored ? '(Yoksayıldı)' : ''}`;
        else if (proj) statusText = `Tahmini regl ${proj.dayNum}. gün`;
        else if (fertile === 'ovulation') statusText = '🌸 Tahmini Ovülasyon';
        else if (fertile === 'fertile') statusText = '🟢 Doğurganlık Penceresi';

        let diarySummary = '';
        if (hasDiaryData(diary)) {
          const meds = [
            ...(diary.meds || []).map(id => MED_OPTIONS.find(x => x.id === id)?.label).filter(Boolean),
            ...(diary.customMeds || [])
          ].join(', ');
          const sym = (diary.symptoms || []).map(id => SYMPTOM_OPTIONS.find(x => x.id === id)?.label).filter(Boolean).join(', ');
          const mood = (diary.moods || []).map(id => MOOD_OPTIONS.find(x => x.id === id)?.label).filter(Boolean).join(', ');
          diarySummary = `
            <div class="mt-2 p-2.5 rounded-xl bg-white/90 dark:bg-slate-900/70 border border-slate-200/70 dark:border-slate-700 text-[11px] text-slate-600 dark:text-slate-300 space-y-0.5">
              ${meds ? `<p><strong>İlaç:</strong> ${escapeHtml(meds)}</p>` : ''}
              ${sym ? `<p><strong>Belirti:</strong> ${sym}</p>` : ''}
              ${mood ? `<p><strong>Ruh Hali:</strong> ${mood}</p>` : ''}
              ${diary.note ? `<p class="italic">"${escapeHtml(diary.note)}"</p>` : ''}
            </div>
          `;
        }

        return `
          <div class="p-3.5 rounded-2xl border ${theme.border} ${theme.cardBg}">
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm font-bold text-slate-900 dark:text-white">${escapeHtml(profile.name)}</span>
              <span class="text-[11px] font-bold ${theme.accentText}">${statusText}</span>
            </div>
            ${diarySummary}
            <div class="flex items-center gap-2 mt-3">
              <button onclick="closeModal(); openAddPeriodModal('${profile.id}', ${log ? `'${log.periodId}'` : 'null'}, '${dateStr}')" class="flex-1 py-2 rounded-xl text-[11px] font-bold ${theme.btnPrimary} active:scale-95 transition">
                ${log ? 'Regl Kaydını Düzenle' : 'Bu Tarihte Regl Başlat'}
              </button>
              <button onclick="closeModal(); uiState.diaryProfile='${profile.id}'; uiState.diaryDate='${dateStr}'; switchTab('diary');" class="py-2 px-3 rounded-xl text-[11px] font-bold ${theme.btnSoft} active:scale-95 transition">
                Günlük / İlaç
              </button>
            </div>
          </div>
        `;
      }).join('');

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${formatDateFull(dateStr)}</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">Günlük detay ve hızlı işlemler</p>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center font-bold">✕</button>
        </div>
        <div class="space-y-3">
          ${blocks}
        </div>
      `);
    }

    function openAddPeriodModal(defaultProfileId = null, editPeriodId = null, presetStartDate = null) {
      const pid = defaultProfileId || (uiState.activeTab === 'analytics' ? uiState.analyticsProfile : 'p1');
      const profile = appData.profiles[pid];
      const existing = editPeriodId ? profile.periods.find(p => p.id === editPeriodId) : null;

      const startVal = existing ? existing.startDate : (presetStartDate || getTodayStr());
      const endVal = existing ? (existing.endDate || '') : '';
      const ignoredVal = existing ? existing.ignored : false;

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${existing ? 'Regl Kaydını Düzenle' : 'Yeni Regl Kaydı Ekle'}</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center font-bold">✕</button>
        </div>

        <form onsubmit="submitPeriodForm(event, '${existing ? existing.id : ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Kişi Seçin</label>
            <select id="period-form-profile" ${existing ? 'disabled' : ''} class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3.5 py-2.5 text-xs font-bold text-slate-900 dark:text-white">
              <option value="p1" ${pid === 'p1' ? 'selected' : ''}>${escapeHtml(appData.profiles.p1.name)}</option>
              <option value="p2" ${pid === 'p2' ? 'selected' : ''}>${escapeHtml(appData.profiles.p2.name)}</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Başlangıç Tarihi *</label>
              <input id="period-form-start" type="date" required value="${startVal}" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2.5 text-xs font-bold text-slate-900 dark:text-white" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Bitiş Tarihi (Opsiyonel)</label>
              <input id="period-form-end" type="date" value="${endVal}" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2.5 text-xs font-bold text-slate-900 dark:text-white" />
            </div>
          </div>
          <p class="text-[10px] text-slate-400 -mt-2">Regl hâlâ devam ediyorsa bitiş tarihini boş bırakabilirsiniz.</p>

          <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 cursor-pointer">
            <input id="period-form-ignored" type="checkbox" ${ignoredVal ? 'checked' : ''} class="w-4 h-4 rounded accent-rose-600" />
            <div>
              <span class="block text-xs font-bold text-slate-800 dark:text-slate-100">Ortalamadan Hariç Tut (Yoksay)</span>
              <span class="block text-[10px] text-slate-500 dark:text-slate-400">Düzensiz veya çok kısa bir döngüyse ortalamayı bozmaz.</span>
            </div>
          </label>

          <div class="flex items-center gap-2 pt-2">
            ${existing ? `
              <button type="button" onclick="deletePeriod('${pid}', '${existing.id}')" class="py-3 px-4 rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 font-bold text-xs border border-rose-200 dark:border-rose-800 active:scale-95 transition">
                Sil
              </button>
            ` : ''}
            <button type="submit" class="flex-1 py-3 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-xs shadow-md active:scale-95 transition">
              ${existing ? 'Değişiklikleri Kaydet' : 'Kaydı Ekle'}
            </button>
          </div>
        </form>
      `);
    }

    function submitPeriodForm(e, editId) {
      e.preventDefault();
      const pid = document.getElementById('period-form-profile').value;
      const startDate = document.getElementById('period-form-start').value;
      const endDate = document.getElementById('period-form-end').value || null;
      const ignored = document.getElementById('period-form-ignored').checked;

      if (!startDate) return;
      if (endDate && endDate < startDate) {
        showToast('Bitiş tarihi başlangıçtan önce olamaz', true);
        return;
      }

      const profile = appData.profiles[pid];
      if (editId) {
        const item = profile.periods.find(p => p.id === editId);
        if (item) {
          item.startDate = startDate;
          item.endDate = endDate;
          item.ignored = ignored;
        }
        showToast('Regl kaydı güncellendi');
      } else {
        profile.periods.push({ id: generateId(), startDate, endDate, ignored });
        showToast('Yeni regl kaydı eklendi');
      }

      saveData();
      closeModal();
      renderApp();
    }

    function deletePeriod(pid, periodId) {
      appData.profiles[pid].periods = appData.profiles[pid].periods.filter(p => p.id !== periodId);
      saveData();
      closeModal();
      showToast('Kayıt silindi');
      renderApp();
    }

    function openResetConfirmModal() {
      openModal(`
        <div class="text-center space-y-3 py-2">
          <div class="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-300 flex items-center justify-center mx-auto text-xl">⚠️</div>
          <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Veriler Sıfırlansın mı?</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
            Yasemin ve Elif isimleri korunur. İsterseniz tamamen boş başlayabilir veya örnek verilere dönebilirsiniz.
          </p>
          <div class="flex flex-col gap-2 pt-2">
            <button onclick="resetAllData(false)" class="w-full py-3 rounded-2xl bg-rose-600 text-white text-xs font-bold active:scale-95 transition">
              Temiz Başlangıç Yap (Tüm Kayıtları Sil)
            </button>
            <button onclick="resetAllData(true)" class="w-full py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold active:scale-95 transition">
              Örnek Verilere Sıfırla
            </button>
            <button onclick="closeModal()" class="w-full py-2 text-xs font-semibold text-slate-400">
              Vazgeç
            </button>
          </div>
        </div>
      `);
    }

    function resetAllData(withSample) {
      const keepDark = Boolean(appData.appearance && appData.appearance.darkMode);
      if (withSample) {
        appData = createSampleData();
        appData.appearance.darkMode = keepDark;
      } else {
        appData = {
          isSampleData: false,
          appearance: { darkMode: keepDark },
          security: { pinEnabled: false, pinCode: '' },
          profiles: {
            p1: { id: 'p1', name: 'Yasemin', defaultCycleLength: 30, defaultPeriodLength: 5, sadeMod: false, periods: [], diary: {} },
            p2: { id: 'p2', name: 'Elif', defaultCycleLength: 29, defaultPeriodLength: 5, sadeMod: true, periods: [], diary: {} }
          }
        };
      }
      saveData();
      closeModal();
      showToast(withSample ? 'Örnek veriler yüklendi' : 'Tüm veriler temizlendi');
      renderApp();
    }

    /* ============================================================================
       11. JSON BACKUP & RESTORE
       ============================================================================ */
    function exportBackupJson() {
      try {
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `yasemin_elif_yedek_${getTodayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('JSON yedeği indirildi');
      } catch (err) {
        showToast('Yedekleme sırasında hata oluştu', true);
      }
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.profiles || !parsed.profiles.p1 || !parsed.profiles.p2) {
            throw new Error('Geçersiz yedek formatı');
          }
          if (!parsed.appearance) parsed.appearance = { darkMode: false };
          appData = parsed;
          saveData();
          applyThemeClass();
          showToast('Yedek başarıyla geri yüklendi');
          renderApp();
        } catch (err) {
          showToast('Geçersiz JSON yedek dosyası', true);
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    /* ============================================================================
       12. PIN LOCK SYSTEM
       ============================================================================ */
    let pinMode = 'unlock';
    let pinBuffer = '';
    let pinTempFirst = '';

    function showPinScreen(mode) {
      pinMode = mode;
      pinBuffer = '';
      pinTempFirst = '';
      const screen = document.getElementById('pin-lock-screen');
      const title = document.getElementById('pin-title');
      const sub = document.getElementById('pin-subtitle');
      const cancelBtn = document.getElementById('pin-cancel-btn');
      document.getElementById('pin-error').textContent = '';

      if (mode === 'unlock') {
        title.textContent = 'Uygulama Kilitli';
        sub.textContent = 'Devam etmek için 4 haneli PIN kodunuzu girin';
        cancelBtn.classList.add('invisible');
      } else {
        title.textContent = 'Yeni PIN Oluştur';
        sub.textContent = '4 haneli bir PIN kodu belirleyin';
        cancelBtn.classList.remove('invisible');
      }
      updatePinDots();
      screen.classList.remove('hidden');
      screen.classList.add('flex');
    }

    function hidePinScreen() {
      const screen = document.getElementById('pin-lock-screen');
      screen.classList.add('hidden');
      screen.classList.remove('flex');
    }

    function togglePinSetting() {
      if (appData.security.pinEnabled) {
        appData.security.pinEnabled = false;
        appData.security.pinCode = '';
        saveData();
        showToast('PIN kilidi kapatıldı');
        renderApp();
      } else {
        startPinSetup();
      }
    }

    function startPinSetup() { showPinScreen('setup_1'); }
    function cancelPinSetup() { if (pinMode !== 'unlock') hidePinScreen(); }
    function lockAppManually() { if (appData.security.pinEnabled) showPinScreen('unlock'); }

    function pressPinKey(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      document.getElementById('pin-error').textContent = '';
      updatePinDots();
      if (pinBuffer.length === 4) setTimeout(handleCompletePin, 140);
    }

    function backspacePin() {
      pinBuffer = pinBuffer.slice(0, -1);
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.getElementById('pin-dots').children;
      for (let i = 0; i < 4; i++) {
        dots[i].className = i < pinBuffer.length
          ? 'w-3.5 h-3.5 rounded-full bg-rose-600 border-2 border-rose-600 scale-110 transition-all'
          : 'w-3.5 h-3.5 rounded-full border-2 border-slate-300 dark:border-slate-600 transition-all';
      }
    }

    function handleCompletePin() {
      const errEl = document.getElementById('pin-error');
      if (pinMode === 'unlock') {
        if (pinBuffer === appData.security.pinCode) {
          hidePinScreen();
        } else {
          errEl.textContent = 'Hatalı PIN kodu, tekrar deneyin.';
          pinBuffer = '';
          updatePinDots();
        }
      } else if (pinMode === 'setup_1') {
        pinTempFirst = pinBuffer;
        pinBuffer = '';
        pinMode = 'setup_2';
        document.getElementById('pin-title').textContent = 'PIN Kodunu Onayla';
        document.getElementById('pin-subtitle').textContent = 'Aynı 4 haneli kodu tekrar girin';
        updatePinDots();
      } else if (pinMode === 'setup_2') {
        if (pinBuffer === pinTempFirst) {
          appData.security.pinEnabled = true;
          appData.security.pinCode = pinBuffer;
          saveData();
          hidePinScreen();
          showToast('PIN kilidi aktif edildi');
          renderApp();
        } else {
          errEl.textContent = 'Kodlar eşleşmedi, baştan deneyin.';
          pinMode = 'setup_1';
          pinBuffer = '';
          pinTempFirst = '';
          document.getElementById('pin-title').textContent = 'Yeni PIN Oluştur';
          document.getElementById('pin-subtitle').textContent = '4 haneli bir PIN kodu belirleyin';
          updatePinDots();
        }
      }
    }

    /* ============================================================================
       13. UTILITIES & BOOTSTRAP
       ============================================================================ */
    let toastTimer = null;
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-text');
      txt.textContent = msg;
      el.className = `fixed top-16 left-1/2 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-lg transition-all duration-200 flex items-center gap-2 whitespace-nowrap ${
        isError ? 'bg-rose-600 text-white' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'
      }`;
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%, 0)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -8px)';
      }, 2200);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderApp();
      if (appData.security.pinEnabled && appData.security.pinCode) {
        showPinScreen('unlock');
      }
    });
  </script>
